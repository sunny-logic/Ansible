---
  - name: Update and upgrade apt packages and Remove dependencies that are no longer required.
    hosts: "{{hostnames}}"
    become: true
    tasks:
    - name: Update and upgrade apt packages
      apt:
        update_cache: yes
        upgrade: yes
      register: debian

    - name: List installed and updated packages
      shell: grep -E "^$(date +%Y-%m-%d).+ (install|upgrade) " /var/log/dpkg.log |cut -d " " -f 3-5
      register: result
      when: debian.changed
    
    - name: Show Output
      debug: msg="{{ result.stdout_lines }}"
      when: debian.changed
      
#    - name: Perform a dist-upgrade.
#      ansible.builtin.apt:
#        upgrade: dist
#        update_cache: yes

    - name: Check if a reboot is required.
      ansible.builtin.stat:
        path: /var/run/reboot-required
        get_checksum: no
      register: reboot_required_file

#    - name: Reboot the server (if required).
#      ansible.builtin.reboot:
#      when: reboot_required_file.stat.exists == true

    - name: Remove useless packages from the cache
      ansible.builtin.apt:
        autoclean: yes
    
    - name: Remove dependencies that are no longer required
      ansible.builtin.apt:
        autoremove: yes
    
    - name: Remove dependencies that are no longer required and purge their configuration files
      ansible.builtin.apt:
        autoremove: yes
        purge: true
    
    - name: Run the equivalent of "apt-get clean" as a separate step
      ansible.builtin.apt:
        clean: yes

#https://docs.ansible.com/projects/ansible/latest/collections/community/docker/docker_compose_v2_module.html
    - name: Restart containers
      become: True
      shell:
        cmd: "{{compose_bin}} {{compose_file}} {{compose_props}} {{compose_options}}"
        chdir: "{{compose_path}}"
      when: 
        - ansible_hostname == docker_host
        - debian.changed
      register: restart_result


    - name: Pause for configured number of minutes for containers to start-up
      ansible.builtin.pause:
        minutes: "{{ pause_minutes }}"
      when:
        - ansible_hostname == docker_host
        - debian.changed
        - restart_result is succeeded

# Verify backup status on specific host
    - name: Verify rclone and MEGA status on specific host
      when: 
        - target_host is defined
        - inventory_hostname == backup_host
      block:
        - name: Check that rclone is using the correct local path
          ansible.builtin.command: which rclone
          register: rclone_path_check
          changed_when: false
          failed_when: rclone_path_check.stdout != "/usr/local/bin/rclone"

        - name: Run rclone about to verify backup target connection
          ansible.builtin.command: "rclone about mega_remote:"
          register: rclone_about_check
          changed_when: false

        - name: Display backup target storage information
          ansible.builtin.debug:
            msg: "{{ rclone_about_check.stdout_lines }}"
